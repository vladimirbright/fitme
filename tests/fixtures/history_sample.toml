# Synthetic sample for `fitme history import` (docs/import-format.md). Every number here is
# made up for the tests; it is not anyone's training log. Committable on purpose: the
# gitignored personal-data patterns are `*.import.toml` / `*.import.json`, and this file is
# neither.

[meta]
version = 1
timezone = "Europe/Berlin"

[aliases]
"Squat" = "barbell_back_squat"
"DB bench" = "dumbbell_bench_press"
"Push-up" = "pushup"
"Leg press" = "machine_leg_press"

