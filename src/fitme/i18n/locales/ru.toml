[halt]
message = "Тренировка остановлена на сегодня. Если у вас есть боль (не обычная крепатура после тренировки), головокружение, онемение, дискомфорт в груди или ощущение, что что-то «щёлкнуло», пожалуйста, обратитесь к врачу — при боли в груди или других серьёзных симптомах немедленно вызовите скорую помощь. Это мера предосторожности, а не диагностика. Если это было недоразумение, вы сможете снять эту блокировку завтра."

[precheck]
question = "Были ли у вас после последней тренировки боль (не обычная крепатура), головокружение, онемение, дискомфорт в груди или ощущение, что что-то «щёлкнуло»?"
yes_button = "Да"
no_button = "Нет"

[checkin]
