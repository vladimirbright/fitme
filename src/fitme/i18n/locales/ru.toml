# Fitme locale: Russian (A§5, A§6, A§9.1, A§12; AGENTS.md §3). Same key set and `{param}`
# names as `en.toml` — see that file's header for the loader and parity rules.

[disclosure]
ai = "Планы создаются ИИ. Это не медицинская консультация."

[commands]
start = "Показать приветствие или начать настройку"
help = "Список команд"
profile = "Посмотреть или изменить настройки анкеты"
plan = "Создать или изменить план тренировок"
train = "Начать сегодняшнюю тренировку"
stats = "Краткая статистика тренировок"
system = "Статистика экземпляра: использование и стоимость"
export = "Скачать все свои данные в формате JSON"
delete = "Удалить аккаунт и все данные"
cancel = "Выйти из текущего шага"

[help]
intro = "Команды Fitme:"

[start]
unbound = "Это приватный инстанс Fitme. Fitme — проект с открытым исходным кодом: вы можете запустить свой собственный инстанс. Исходный код: {source_url}"
bound_no_profile = "Добро пожаловать. Fitme — генератор планов тренировок и дневник тренировок: планы создаются ИИ, это не медицинская консультация. Давайте настроим анкету."
bound_with_profile = "С возвращением. Планы создаются ИИ; это не медицинская консультация. Используйте кнопки «План», «Тренировка» или «Статистика» ниже."

[setup.language]
prompt = "Выберите язык:"
change_button = "Изменить"

[setup.timezone]
prompt = "Какой у вас часовой пояс? Выберите один из списка или введите вручную (например, Europe/Berlin)."
manual_button = "Ввести вручную"
manual_prompt = "Отправьте ваш часовой пояс в формате IANA, например Europe/Berlin."
invalid = "Это не похоже на часовой пояс. Попробуйте ещё раз (например, Europe/Berlin), либо выберите из списка."

[setup.age]
prompt = "Какой у вас возрастной диапазон?"

[setup.weight]
prompt = "Какой у вас весовой диапазон?"

[setup.experience]
duration_prompt = "Как долго вы регулярно тренируетесь, минимум дважды в неделю?"
barbell_prompt = "Выполняли ли вы упражнения со штангой (присед, становая тяга, жим лёжа) с уверенной техникой?"

[setup.screening]
intro = "Несколько быстрых вопросов о здоровье, чтобы план можно было составить безопасно. Это проверка безопасности, а не медицинское обследование — она влияет только на то, какие упражнения будут предложены."
clearance_prompt = "Разрешил ли врач силовые тренировки?"
areas_prompt = "Есть ли у вас сейчас травмы или проблемные зоны? Отметьте все подходящие варианты."
areas_none_option = "Ничего из этого"
other_prompt = "Есть ли что-то ещё, что может повлиять на тренировки? Можно написать текстом или пропустить этот шаг."
other_skip_button = "Пропустить"

[setup.preferences]
prompt = "Какой формат тренировок вам интересен? Отметьте все подходящие варианты."

[setup.focus]
prompt = "Какая у вас основная цель?"

[setup.location]
prompt = "Где вы будете тренироваться?"

[setup.equipment]
prompt = "Какой инвентарь у вас есть дома? Отметьте все подходящие варианты."

[setup.frequency]
