# Fitme locale: English (A§5, A§6, A§9.1, A§12; AGENTS.md §3).
#
# Loaded by `fitme.i18n` via importlib.resources + tomllib, then flattened into dotted keys
# (`[setup.language]` + `prompt = "..."` -> `"setup.language.prompt"`). `ru.toml` must define
# exactly the same key set, and any `{param}` used here must be used in `ru.toml` too
# (`fitme.i18n.check_parity`, `fitme catalog check`).
#
# Wording rules (AGENTS.md §3, A§12): never "trainer/coach/physio/your personal X"; never a
# diagnosis, treatment or disease claim; no weight-loss or body-composition claims; state that
# plans are AI-generated. Screening questions ask what might affect training, not for a
# diagnosis. Plan-first tone: no companion persona, no small talk.

