# Fitme locale: English (A§5, A§6, A§9.1, A§12; AGENTS.md §3).
#
# Loaded by `fitme.i18n` via importlib.resources + tomllib, then flattened into dotted keys
# (`[setup.language]` + `prompt = "..."` -> `"setup.language.prompt"`). `ru.toml` must define
# exactly the same key set, and any `{param}` used here must be used in `ru.toml` too
# (`fitme.i18n.check_parity`, `fitme catalog check`).
#
# Wording rules (AGENTS.md §3, A§12): never "trainer/coach/physio/your personal X"; never a
# diagnosis, treatment or disease claim; no weight-loss or body-composition claims; state that
# plans are AI-generated. Screening questions ask what might affect training, not for a
# diagnosis. Plan-first tone: no companion persona, no small talk.

[disclosure]
ai = "Plans are generated by AI. This is not medical advice."

[commands]
start = "Show the intro, or start setup"
help = "List commands"
profile = "View or edit your setup answers"
plan = "Create or revise a training plan"
train = "Start today's workout"
stats = "Short training stats"
system = "Instance stats: usage and cost"
export = "Download all your data as JSON"
delete = "Delete your account and all data"
cancel = "Leave the current step"

[help]
intro = "Fitme commands:"

[start]
unbound = "This is a private Fitme instance. Fitme is open source: you can run your own instance. Source code: {source_url}"
bound_no_profile = "Welcome. Fitme is a training plan generator and training log — plans are generated by AI, this is not medical advice. Let's set up your profile."
bound_with_profile = "Welcome back. Plans are generated by AI; this is not medical advice. Use Plan, Train or Stats below."

[setup.language]
prompt = "Choose your language:"
change_button = "Change"

[setup.timezone]
prompt = "What's your timezone? Pick one, or type it (e.g. Europe/Berlin)."
manual_button = "Type it myself"

[setup.age]
prompt = "What's your age range?"

[setup.weight]
prompt = "What's your weight range?"

[setup.experience]
duration_prompt = "How long have you been training regularly, at least twice a week?"
barbell_prompt = "Have you done barbell lifts (squat, deadlift, bench press) with confident technique?"

[setup.screening]
intro = "A few quick questions about your health, so the plan can be generated safely. This is a safety check, not a medical evaluation — it only affects which exercises are offered."
clearance_prompt = "Has a doctor cleared you for strength training?"
areas_prompt = "Do you currently have any injuries or sore areas? Select all that apply."
areas_none_option = "None of these"
other_prompt = "Anything else that might affect your training? You can type it, or skip this."
other_skip_button = "Skip"

[setup.preferences]
prompt = "What kind of training do you want? Select all that apply."

[setup.focus]
prompt = "What's your main focus?"

[setup.location]
prompt = "Where will you train?"

[setup.equipment]
prompt = "Which equipment do you have at home? Select all that apply."

[setup.frequency]
prompt = "How many sessions per week?"

[setup.session_length]
prompt = "How long should each session be?"

[setup.summary]
title = "Here's what you told us:"
fix_button = "Fix"
confirm_button = "Looks good"

[setup.common]
back_button = "Back"
cancel_hint = "Send /cancel at any time to leave this."

