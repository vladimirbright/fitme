[refusal]
needs_clearance = "This needs a doctor's clearance before a plan can be generated. Please talk to a doctor about strength training, then update your answer in /profile."
open_health_hold = "Training is on hold from an earlier session. Clear the hold first (see the message from that session) before a new plan or workout."
no_safe_exercises = "There aren't enough safe exercises available for your current setup to build a plan. Try adjusting your equipment, location or injury answers in /profile."
no_safe_plan = "A plan couldn't be generated that passes every safety check. Please try again, or adjust your preferences in /profile."
out_of_scope = "That request is outside what this assistant can help with."
llm_unavailable = "The plan generator is temporarily unavailable. Please try again shortly."
profile_incomplete = "Setup isn't finished yet. Please complete /profile first."
screening_incomplete = "One or more health screening questions still need an answer. Please complete them in /profile before a plan can be generated."

[halt]
message = "Training is stopped for today. If you have pain (not normal muscle soreness), dizziness, numbness, chest discomfort, or felt something pop, please contact a doctor — for chest pain or other severe symptoms, contact emergency services right away. This is a precaution, not a diagnosis. If this was a misunderstanding, you'll be able to clear this hold tomorrow."

[precheck]
question = "Since your last session, have you had pain (not normal muscle soreness), dizziness, numbness, chest discomfort, or felt something pop?"
yes_button = "Yes"
no_button = "No"

[checkin]
question = "How did your {area} feel?"
answer_fine = "Fine"
answer_worse = "Worse than usual"
answer_pain = "Pain"

[hold_clear]
question = "Are you now free of pain, dizziness, numbness and chest discomfort?"
button = "Yes, clear"

[workout]
according_to_plan_button = "✅ According to plan"
enter_results_button = "✏️ Enter results"
skip_button = "⏭ Skip"
pain_button = "⚠ Pain / feeling unwell"

[load]
# A two-dumbbell exercise's shown `kg` is the weight of each dumbbell, not the combined
# total (A§4.4 "loads are per implement"). UI/prompt copy that shows a dumbbell load uses
# this to say so explicitly.
per_dumbbell = "{kg} kg per dumbbell"

[errors]
generic = "Something went wrong. Please try again."
stale_callback = "That button isn't active anymore."

[web]
footer = "Plans are generated by AI. This is not medical advice."

[web.login]
title = "Fitme"
description = "A training plan generator and training log."
