id = "machine_reverse_grip_pulldown"
names = { en = "Reverse-grip lat pulldown", ru = "Тяга верхнего блока обратным хватом" }
kind = "compound"
pattern = "vertical_pull"
measures = ["reps"]
qualities = ["strength", "hypertrophy"]
equipment = ["machine"]
load_unit = "total"
locations = ["public_gym", "studio_gym"]
