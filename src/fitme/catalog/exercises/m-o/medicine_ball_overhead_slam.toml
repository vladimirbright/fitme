instructions = { en = "Stand with feet hip-width apart, holding a slam ball overhead with both hands. Drive the ball down to the floor in front of your feet while hinging at the hips with a braced torso. Pick it up with a flat back and bring it overhead again. Use a ball made for slams and keep your feet clear of its landing spot.", ru = "Встаньте, ноги на ширине таза, держите слэмбол двумя руками над головой. Бросьте мяч в пол перед стопами, наклонившись в тазобедренных суставах и удерживая корпус напряжённым. Поднимите мяч с прямой спиной и снова выведите над головой. Используйте мяч для бросков об пол и следите, чтобы стопы были в стороне от места падения." }
