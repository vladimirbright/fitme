instructions = { en = "Adjust the seat so the handles sit at about chest height with a slight elbow bend at the far point. Turn the handles at a steady pace you can sustain while talking. Keep your back against the seat and shoulders relaxed.", ru = "Отрегулируйте сиденье так, чтобы рукоятки были примерно на уровне груди, а в дальней точке локти оставались слегка согнутыми. Крутите рукоятки ровным темпом, при котором можно говорить. Спина прижата к сиденью, плечи расслаблены." }
