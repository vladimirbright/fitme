instructions = { en = "Sit in the leg press with the balls of the feet low on the platform, heels hanging off, knees nearly straight but not locked. Press the platform by extending the ankles, pause, then bring the heels back slowly. Set the safety stops before you start and do not lock the knees.", ru = "Сядьте в тренажёр для жима ногами, передняя часть стопы внизу платформы, пятки свисают, колени почти прямые, но не заблокированы. Выжмите платформу, разгибая голеностоп, задержитесь и медленно верните пятки. Заранее выставьте ограничители и не блокируйте колени." }
