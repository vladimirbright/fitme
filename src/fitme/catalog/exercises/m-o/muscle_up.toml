instructions = { en = "Hang from the bar with a false or full overhand grip. Pull explosively until the bar reaches your chest, then rotate your wrists and elbows over the bar. Press up to straight arms above the bar. Lower back down slowly under control, and only try it with a strong pull-up and dip base.", ru = "Повисните на перекладине хватом сверху (обычным или «ложным»). Резко подтяните тело, пока перекладина не окажется у груди, затем переведите кисти и локти над перекладиной. Выжмите тело до прямых рук над перекладиной. Медленно опуститесь под контролем; выполняйте только при уверенных подтягиваниях и отжиманиях на брусьях." }
