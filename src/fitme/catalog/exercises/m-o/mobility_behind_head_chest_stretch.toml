instructions = { en = "Stand tall with feet shoulder-width apart and fingers lightly interlaced behind your head. Open the elbows out to the sides and gently draw the shoulder blades together until you feel a mild pull across the chest. Do not pull on the head. Hold 15-30 seconds, breathing evenly.", ru = "Встаньте прямо, ноги на ширине плеч, пальцы свободно сцеплены за головой. Разведите локти в стороны и мягко сведите лопатки до лёгкого натяжения в груди. Не тяните голову руками. Удерживайте 15-30 секунд, дышите ровно." }
