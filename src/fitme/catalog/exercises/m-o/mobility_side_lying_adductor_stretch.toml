instructions = { en = "Lie on your side next to a bench with the bottom knee bent. Lift the straight top leg and rest the inner edge of that foot on the bench. Let the hips relax toward the floor until you feel a mild stretch along the inner thigh. Hold, then switch sides.", ru = "Лягте на бок рядом со скамьёй, нижняя нога согнута в колене. Поднимите прямую верхнюю ногу и положите стопу внутренним краем на скамью. Расслабьте таз вниз к полу до лёгкого растяжения по внутренней стороне бедра. Задержитесь и смените сторону." }
