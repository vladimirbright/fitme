id = "machine_assisted_chest_dip"
names = { en = "Assisted chest dip machine (kneeling)", ru = "Отжимания на брусьях в гравитроне (с колен)" }
kind = "compound"
pattern = "vertical_push"
equipment = ["machine"]
load_unit = "total"
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "calibration" }
instructions = { en = "Start with plenty of assistance and place your knees on the pad. Hold the handles with arms straight and the torso leaning slightly forward. Bend the elbows until the upper arms are about level with the floor, then press back up. Keep the shoulders down and the range controlled.", ru = "Начните с большой помощи и поставьте колени на подушку. Возьмитесь за рукояти на прямых руках, корпус слегка наклонён вперёд. Сгибайте локти, пока плечи не окажутся примерно параллельно полу, затем выжмитесь обратно. Плечи опущены, амплитуда подконтрольная." }
load_step_kg = 2.5
