instructions = { en = "Stand side-on to a solid wall with the ball held at the shoulder in the rear hand, the elbow behind it. Drive from the back foot, turn the hips and push the ball forward into the wall like a shot put, keeping the wrist behind the ball. Catch, reset and repeat; do both sides. Use a light ball and a wall that is clear of people and objects.", ru = "Встаньте боком к прочной стене, мяч у плеча в дальней руке, локоть за мячом. Оттолкнитесь задней ногой, разверните таз и вытолкните мяч вперёд в стену, как ядро, кисть остаётся за мячом. Поймайте, вернитесь в исходное положение и повторите; выполните в обе стороны. Берите лёгкий мяч, рядом со стеной не должно быть людей и предметов." }
