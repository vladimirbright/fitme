instructions = { en = "Lie on your back with the kettlebell in one hand, arm vertical. Bend the knee on the loaded side and place that foot flat; extend the other leg and arm out to the side. Roll onto the free elbow, then hand, lift the hips, and sweep the free leg back to kneeling before standing. Reverse the stages under control, keeping the bell overhead. Learn the sequence without weight first.", ru = "Лягте на спину с гирей в одной руке, удерживая её вертикально. Согните колено со стороны гири и поставьте стопу на пол; другую ногу и руку отведите в сторону. Поднимитесь на локоть свободной руки, затем на ладонь, приподнимите таз и заведите свободную ногу назад до стойки на колене, после чего встаньте. Под контролем повторите этапы в обратном порядке, удерживая гирю над головой. Сначала освойте движение без веса." }
