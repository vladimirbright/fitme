instructions = { en = "Hold a light kettlebell at your shoulder, elbow tucked against your side, feet wider than shoulders. Turn slightly away and lean your torso to the side and down while the forearm stays vertical, so the arm straightens as your body moves under the bell. Stand up with the arm locked overhead, then lower the bell to your shoulder; if you lose control, step away and let it drop to the side.", ru = "Держите лёгкую гирю у плеча, локоть прижат к корпусу, ноги шире плеч. Слегка повернитесь от гири и наклоняйте корпус вбок и вниз, предплечье остаётся вертикальным, так что рука выпрямляется, пока тело уходит под гирю. Выпрямитесь с зафиксированной над головой рукой, затем опустите гирю к плечу; если контроль потерян, отойдите и дайте ей упасть в сторону." }
