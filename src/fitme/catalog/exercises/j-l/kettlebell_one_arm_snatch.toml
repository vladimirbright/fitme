instructions = { en = "Hinge at the hips with the kettlebell swinging back between your legs. Drive your hips forward and pull the bell up close to the body, then guide it overhead to a locked arm. Let it fall back along the same path into the next swing. Finish one side before switching; use a light weight and clear space.", ru = "Наклонитесь в тазобедренных суставах, гиря уходит назад между ног. Толкните таз вперёд и подтяните гирю близко к телу, затем выведите её над головой до зафиксированной руки. Дайте ей вернуться по тому же пути в следующий мах. Выполните одну сторону и смените; вес лёгкий, место свободное." }
