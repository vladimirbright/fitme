instructions = { en = "Press the kettlebell overhead with one arm locked out, feet wider than shoulders, the foot opposite the bell turned slightly out. Push your hips back toward the weighted side and slide your free hand down the opposite leg, eyes on the bell, then return. Lower only as far as you can keep the back straight and the arm stacked over the shoulder. Start light.", ru = "Выжмите гирю одной рукой над головой, рука зафиксирована, ноги шире плеч, стопа с противоположной стороны слегка развёрнута наружу. Отведите таз назад в сторону гири и скользите свободной рукой вниз вдоль противоположной ноги, взгляд на гире, затем вернитесь. Опускайтесь только пока можете удерживать спину ровной, а руку над плечом. Начните с лёгкого веса." }
