id = "pull_up"
names = { en = "Pull-up", ru = "Подтягивания" }
kind = "bodyweight"
pattern = "vertical_pull"
measures = ["reps"]
qualities = ["strength", "hypertrophy"]
equipment = ["pull_up_bar"]
load_unit = "total"
locations = ["public_gym", "studio_gym", "home_equipment", "outdoor"]
loads_areas = ["shoulder", "elbow_wrist", "neck"]
# Conservative: hanging fully from the bar puts load through the abdominal wall exactly like
# every other hanging pull in this catalog (chin_up, band_assisted_pull_up,
# machine_assisted_pull_up, hanging_leg_raise) — all contraindicate hernia for consistency.
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "neck_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "bodyweight" }
instructions = { en = "Hang from the bar with an overhand grip, hands just outside shoulder width. Pull your chin above the bar, then lower back down under control.", ru = "Повисните на перекладине хватом сверху, руки чуть шире плеч. Подтянитесь подбородком выше перекладины, затем опуститесь под контролем." }
