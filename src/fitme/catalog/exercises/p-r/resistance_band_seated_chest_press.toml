id = "resistance_band_seated_chest_press"
names = { en = "Resistance band seated chest press", ru = "Жим от груди сидя с лентой" }
kind = "compound"
pattern = "horizontal_push"
measures = ["reps"]
qualities = ["hypertrophy"]
equipment = ["resistance_bands", "bench"]
locations = ["public_gym", "studio_gym", "home_equipment"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "hernia"]
increment_kg = 1.0
start = { kind = "calibration" }
instructions = { en = "Secure the band to a stable anchor at chest height behind the bench; do not rely on the bench to hold the band. Sit upright facing away from the anchor, one end in each hand at chest level. Press both hands forward, then return slowly without letting the band snap back.", ru = "Надёжно закрепите ленту на устойчивой опоре на уровне груди за скамьёй; не используйте саму скамью как крепление. Сядьте прямо спиной к креплению, концы ленты держите у груди. Выжмите руки вперёд, затем медленно верните их, не позволяя ленте резко сократиться." }
