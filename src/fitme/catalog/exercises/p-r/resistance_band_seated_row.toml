instructions = { en = "Sit on the floor with legs extended and loop the band securely around the soles of both feet so it cannot slip off. Hold the ends with palms facing each other. Sit tall and pull the hands to your lower ribs, squeezing the shoulder blades. Return slowly without rounding forward or letting the band snap back.", ru = "Сядьте на пол с вытянутыми ногами и надёжно оберните ленту вокруг подошв обеих стоп, чтобы она не соскользнула. Возьмите концы ленты ладонями друг к другу. Держа спину прямо, тяните руки к нижним рёбрам, сводя лопатки. Медленно вернитесь, не заваливаясь вперёд и не отпуская ленту резко." }
