instructions = { en = "Use a low, stable box. Jump onto it and land softly on one foot, the other leg held off the edge. Balance for a moment, then step down with control. Alternate the landing leg and stop when your landings get noisy.", ru = "Используйте невысокий устойчивый бокс. Запрыгните на него и мягко приземлитесь на одну ногу, другая нога на весу у края. Удержите равновесие и аккуратно спуститесь шагом. Чередуйте ногу приземления и прекращайте, когда приземление становится тяжёлым." }
