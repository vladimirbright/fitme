instructions = { en = "Use a low, stable box. Jump from both feet and land softly on one foot near the center of the box, with the whole landing foot supported and the other leg raised. Bend the landing knee slightly and hold your balance, then step down with control. Alternate the landing leg and stop when landings get noisy or unsteady.", ru = "Используйте невысокий устойчивый бокс. Оттолкнитесь двумя ногами и мягко приземлитесь на одну ногу ближе к центру бокса, полностью поставив стопу на поверхность; другую ногу держите на весу. Слегка согните опорное колено и удержите равновесие, затем аккуратно спуститесь шагом. Чередуйте ногу приземления и прекращайте, когда приземление становится тяжёлым или неустойчивым." }
