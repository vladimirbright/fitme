start = { kind = "calibration" }
instructions = { en = "Hinge forward with a flat back and soft knees, holding a light bar below your chest with straight arms. Sweep the bar back and up in a small arc until your arms are about parallel to the floor, then lower slowly. Keep the load light.", ru = "Наклонитесь вперёд с ровной спиной и мягкими коленями, лёгкий гриф в прямых руках под грудью. Небольшой дугой отведите гриф назад и вверх, пока руки не станут примерно параллельны полу, затем медленно опустите. Вес лёгкий." }
load_step_kg = 2.5
