instructions = { en = "Clear a few metres of floor. Take a long step forward and bend both knees until the back knee nears the floor. Drive through the front foot and bring the rear foot past it into the next step. Keep the front knee in line with the toes; shorten the step if balance wavers.", ru = "Освободите несколько метров пола. Сделайте широкий шаг вперёд и согните обе ноги, пока заднее колено не окажется близко к полу. Оттолкнитесь передней ногой и перенесите заднюю ногу вперёд в следующий шаг. Переднее колено смотрит по линии носка; если теряете равновесие, укоротите шаг." }
