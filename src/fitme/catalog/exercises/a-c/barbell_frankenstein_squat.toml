instructions = { en = "Set the bar in the rack at shoulder height and the safety arms just below your lowest squat position. Rest the bar on the front of the shoulders and reach both arms straight forward without holding it. Squat down with the torso upright and elbows high, then stand. Keep the load light; if the bar starts to roll, let it fall forward onto the safety arms.", ru = "Установите штангу на стойке на высоте плеч, страховочные упоры чуть ниже нижней точки приседа. Положите гриф на передние дельты и вытяните обе руки прямо вперёд, не держась за штангу. Присядьте с вертикальным корпусом и поднятыми локтями, затем встаньте. Вес лёгкий; если гриф начинает скатываться, отпустите его вперёд на страховочные упоры." }
