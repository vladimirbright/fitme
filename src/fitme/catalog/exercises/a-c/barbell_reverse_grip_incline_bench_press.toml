instructions = { en = "Set the bench to a modest incline and lie back with feet flat. Take an underhand grip about shoulder width, unrack and lower the bar under control to the upper chest, then press back up. Use a lighter weight than usual. Wrap the thumbs fully around the bar. Set the rack's safety arms just below the lowest point of the movement.", ru = "Установите скамью с небольшим наклоном и лягте, стопы на полу. Возьмите гриф обратным хватом примерно на ширине плеч, снимите штангу, под контролем опустите к верху груди и выжмите вверх. Вес берите меньше обычного. Обхватывайте гриф большими пальцами. Установите страховочные упоры чуть ниже нижней точки движения." }
