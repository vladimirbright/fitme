instructions = { en = "Anchor a band to something heavy behind you and loop it around the wheel handle. Kneel on a pad with the wheel under your shoulders and roll forward only as far as you can control, then pull back to your knees. Keep your ribs down and your back flat.", ru = "Закрепите ленту за тяжёлую опору позади и пропустите её через ручку ролика. Встаньте на колени на мат, ролик под плечами; выкатывайтесь вперёд лишь настолько, насколько контролируете, затем вернитесь к коленям. Рёбра опущены, спина ровная." }
