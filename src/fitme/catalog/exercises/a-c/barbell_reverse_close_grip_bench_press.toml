instructions = { en = "Lie on the bench with the safety arms set just below the lowest point. Underhand grip about shoulder width with the thumbs wrapped around the bar, light load. Unrack over the chest, lower to the lower chest with elbows close, then press up. Keep the wrists straight.", ru = "Лягте на скамью, страховочные упоры чуть ниже нижней точки. Обратный хват примерно на ширине плеч, большие пальцы обхватывают гриф, вес лёгкий. Снимите штангу над грудью, опустите к нижней части груди, локти близко, затем выжмите. Кисти держите прямо." }
