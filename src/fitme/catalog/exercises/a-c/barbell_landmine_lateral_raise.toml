instructions = { en = "Wedge one end of an empty barbell into a landmine anchor or a padded corner and stand side-on to it, holding the free end in one hand at hip level. Keeping the arm nearly straight, raise the bar up and out to shoulder height, then lower it slowly. Start with the bar alone, keep your torso still and switch sides.", ru = "Зафиксируйте один конец пустого грифа в креплении лэндмайн или в углу с мягкой прокладкой и встаньте к нему боком, держа свободный конец одной рукой у бедра. Почти прямой рукой поднимите гриф вверх и в сторону до уровня плеч, затем медленно опустите. Начните с пустого грифа, корпус неподвижен, затем смените сторону." }
