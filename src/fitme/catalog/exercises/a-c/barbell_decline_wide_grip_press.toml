instructions = { en = "Lie on a decline bench with your feet secured and take a wide grip on the bar, hands comfortably outside the shoulders. Unrack, lower the bar under control to the lower chest, then press back up. Set the rack's safety arms just below the lowest point of the movement.", ru = "Лягте на скамью с отрицательным наклоном, ноги зафиксированы, возьмите гриф широким хватом, руки комфортно шире плеч. Снимите штангу, под контролем опустите к нижней части груди и выжмите вверх. Установите страховочные упоры чуть ниже нижней точки движения." }
