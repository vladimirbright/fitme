instructions = { en = "Stand with the bar over mid-foot, take an overhand grip a little wider than the shoulders and stand up with the bar. Keep the knees nearly straight and push the hips back, sliding the bar down the legs until the hamstrings stretch. Return by driving the hips forward and keep the back flat throughout.", ru = "Встаньте так, чтобы гриф был над серединой стопы, возьмите его хватом сверху чуть шире плеч и поднимите. Колени почти прямые, таз уходит назад, гриф скользит вдоль ног до растяжения задней поверхности бедра. Вернитесь, выводя таз вперёд; спина прямая на всём протяжении." }
