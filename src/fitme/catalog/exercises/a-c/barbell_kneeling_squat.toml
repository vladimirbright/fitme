instructions = { en = "Set the bar in the rack at shoulder height for kneeling and the safety arms just below the bar's lowest point. Kneel on a pad with the bar on the upper back. Sit the hips back toward the heels, then drive them forward to rise. Keep the weight light.", ru = "Установите штангу в стойке на высоте плеч в положении на коленях, страховочные упоры чуть ниже нижней точки штанги. Встаньте на колени на мягкую подкладку, штанга на верхней части спины. Отведите таз назад к пяткам, затем выведите его вперёд и поднимитесь. Вес лёгкий." }
