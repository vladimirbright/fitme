instructions = { en = "Lie on the bench with feet flat and take a wide underhand grip. Unrack, lower the bar under control to the lower chest, then press back up. Use a lighter weight than usual. Wrap the thumbs fully around the bar. Set the rack's safety arms just below the lowest point of the movement.", ru = "Лягте на скамью, стопы на полу, возьмите гриф широким обратным хватом. Снимите штангу, под контролем опустите к нижней части груди и выжмите вверх. Вес берите меньше обычного. Обхватывайте гриф большими пальцами. Установите страховочные упоры чуть ниже нижней точки движения." }
