instructions = { en = "Stand with the bar hanging in front of your thighs, hands just outside the hips, arms straight. Lift the shoulders straight up toward the ears, without bending the elbows or rolling the shoulders. Lower slowly to full stretch. Keep the neck still and the load light enough for a smooth, controlled movement.", ru = "Встаньте, штанга висит перед бёдрами, хват чуть шире таза, руки прямые. Поднимите плечи строго вверх к ушам, не сгибая локти и не вращая плечами. Медленно опустите до полного растяжения. Шея неподвижна, вес такой, чтобы движение оставалось плавным и контролируемым." }
