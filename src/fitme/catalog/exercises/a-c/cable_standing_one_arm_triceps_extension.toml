instructions = { en = "Stand with your back to a pulley set at about head height and hold the handle in one hand beside your head, upper arm roughly level with the floor and pointing forward. Keep the upper arm still and straighten the arm forward, then bend it back slowly. Switch arms after the set.", ru = "Встаньте спиной к блоку, установленному примерно на уровне головы, рукоять в одной руке у головы, плечо примерно параллельно полу и направлено вперёд. Не двигая плечом, выпрямите руку вперёд, затем медленно согните. После подхода смените руку." }
