instructions = { en = "Set the bar on your upper back as for a squat and stand facing a low, stable bench. Place the whole foot on the bench and drive up until the hip and knee are straight, then step down under control. Keep the bench low and the steps slow; unrack and re-rack the bar at a rack with safety arms.", ru = "Установите штангу на верх спины, как для приседа, и встаньте лицом к низкой устойчивой скамье. Поставьте на неё всю стопу и поднимитесь до выпрямления бедра и колена, затем контролируемо сойдите. Скамья невысокая, шаги медленные; снимайте и возвращайте штангу на стойку со страховочными упорами." }
