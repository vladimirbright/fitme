instructions = { en = "Start in a plank with the hands on the wheel handles, body in one line. Roll the wheel forward as far as you can control, then pull it back with the core. Keep the ribs down and stop before the lower back sags. Use a shorter range if needed.", ru = "Примите упор лёжа, руки на ручках ролика, тело в одной линии. Откатите ролик вперёд насколько можете контролировать, затем вернитесь, подтягивая его корпусом. Рёбра опущены, остановитесь до прогиба поясницы. При необходимости сократите амплитуду." }
