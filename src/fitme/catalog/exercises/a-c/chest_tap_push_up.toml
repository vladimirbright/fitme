instructions = { en = "Start in a push-up position with hands slightly wider than shoulders and feet a little wider than usual. Lower the chest and press back up. At the top, lift one hand to tap the opposite side of the chest, place it back, then do the next rep and tap with the other hand. Keep the hips level.", ru = "Исходное положение для отжиманий, руки чуть шире плеч, стопы чуть шире обычного. Опуститесь и выжмитесь вверх. В верхней точке поднимите одну руку и коснитесь груди с противоположной стороны, верните руку, затем следующий повтор и касание другой рукой. Таз держите ровно." }
