instructions = { en = "Kneel behind a flat bench with your forearms along the pad, palms up, and your wrists just past the far edge, holding the bar shoulder-width. Curl the bar up by bending only the wrists, then lower slowly. Keep the load light.", ru = "Встаньте на колени за горизонтальной скамьёй, предплечья лежат вдоль неё ладонями вверх, кисти чуть за дальним краем, гриф на ширине плеч. Поднимайте гриф, сгибая только запястья, и медленно опускайте. Вес берите небольшой." }
