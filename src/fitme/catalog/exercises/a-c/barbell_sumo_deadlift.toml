instructions = { en = "Stand wide with toes turned out and the bar over mid-foot; use full-size plates or blocks so the bar sits at standard deadlift height. Sit the hips down and grip the bar inside your knees, back flat and chest up. Push the floor apart and stand, hips and shoulders rising together. Keep the bar close to your legs on the way up and down.", ru = "Встаньте широко, носки развёрнуты, гриф над серединой стопы; используйте диски полного диаметра или подставки, чтобы гриф был на стандартной высоте. Опустите таз и возьмите гриф хватом между коленями, спина прямая, грудь развёрнута. Встаньте, как бы разводя пол стопами в стороны; таз и плечи поднимаются одновременно. Ведите гриф близко к ногам при подъёме и опускании." }
