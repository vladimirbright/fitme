instructions = { en = "Hang from the bar with an overhand grip, arms straight and shoulder blades pulled down. Lean back and raise the body, knees tucked at first, until the torso and hips are close to horizontal and you face the ceiling; hold a few seconds, then lower slowly. Stop the set when the hips start to sag.", ru = "Повисните на перекладине хватом сверху, руки прямые, лопатки опущены. Отклонитесь назад и поднимите тело, на первых порах с подтянутыми коленями, пока корпус и таз не станут почти горизонтально лицом вверх; задержитесь на несколько секунд и медленно опуститесь. Завершите подход, когда таз начнёт проседать." }
