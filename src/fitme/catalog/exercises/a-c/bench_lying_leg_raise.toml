instructions = { en = "Lie on a flat bench with your hips at the end, holding the bench behind your head or placing your hands under your glutes. Raise your straight legs toward the ceiling, then lower slowly without touching the floor. Keep your lower back against the bench.", ru = "Лягте на плоскую скамью так, чтобы таз был у края, держитесь за скамью за головой или подложите руки под ягодицы. Поднимите прямые ноги к потолку, затем медленно опустите, не касаясь пола. Поясница прижата к скамье." }
