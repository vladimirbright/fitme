instructions = { en = "Kneel on a pad with the heels hooked under a fixed padded roller, such as the knee pad of a lat pulldown. Keep the body straight from knees to head and lean forward slowly, as far as you can control. Catch yourself with your hands, then push off lightly and pull back up with the legs.", ru = "Встаньте на колени на мат, пятки зафиксированы под неподвижным мягким валиком, например упором для колен в тяге верхнего блока. Держите тело прямым от колен до головы и медленно наклоняйтесь вперёд, пока сохраняете контроль. Подстрахуйтесь руками, слегка оттолкнитесь и вернитесь вверх усилием ног." }
