instructions = { en = "Lie on the bench with feet flat and take a wide grip, forearms staying close to vertical at the bottom. Unrack, lower the bar to the mid-chest, then press back up. Set the rack's safety arms just below the lowest point of the movement.", ru = "Лягте на скамью, стопы на полу, возьмите гриф широким хватом так, чтобы внизу предплечья были близки к вертикали. Снимите штангу, опустите к середине груди и выжмите вверх. Установите страховочные упоры чуть ниже нижней точки движения." }
