id = "band_assisted_pull_up"
names = { en = "Band-assisted pull-up", ru = "Подтягивания с резиновой лентой" }
kind = "bodyweight"
pattern = "vertical_pull"
equipment = ["pull_up_bar", "resistance_bands"]
load_unit = "total"
locations = ["public_gym", "studio_gym", "home_equipment"]
loads_areas = ["shoulder", "elbow_wrist", "neck"]
# Conservative: same hanging-pull hernia consistency as pull_up.toml.
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "neck_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "bodyweight" }
instructions = { en = "Loop a band around the bar and place one knee or foot in it for support. Pull your chin above the bar, then lower back down under control.", ru = "Закрепите ленту на перекладине и поставьте в неё колено или стопу для опоры. Подтянитесь подбородком выше перекладины, затем опуститесь под контролем." }
