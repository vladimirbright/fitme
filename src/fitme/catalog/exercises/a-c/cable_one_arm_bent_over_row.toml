instructions = { en = "Stand facing a low cable, feet shoulder-width, knees soft, and hinge forward with a flat back. Pull the handle to your lower ribs, elbow close to your side, then extend the arm under control. Keep the hips and shoulders square, and finish all reps before switching sides.", ru = "Встаньте лицом к нижнему блоку, ноги на ширине плеч, колени слегка согнуты, наклонитесь вперёд с прямой спиной. Тяните рукоять к низу рёбер, локоть у корпуса, затем под контролем выпрямите руку. Таз и плечи не разворачивайте, все повторения делайте на одну сторону, затем смените." }
