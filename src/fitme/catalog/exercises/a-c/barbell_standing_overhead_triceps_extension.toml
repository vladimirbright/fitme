id = "barbell_standing_overhead_triceps_extension"
names = { en = "Barbell standing overhead triceps extension", ru = "Французский жим со штангой стоя" }
kind = "isolation"
level = "advanced"
pattern = "accessory"
measures = ["reps"]
qualities = ["hypertrophy"]
