start = { kind = "calibration" }
instructions = { en = "Take the bar from a rack at shoulder height, then press it overhead with straight arms and a braced trunk. Bend only the elbows to lower the bar behind your head, then extend. Use a light weight and re-rack it with control.", ru = "Снимите гриф со стойки на уровне плеч и поднимите над головой на прямых руках, корпус напряжён. Сгибайте только локти, опуская гриф за голову, затем разогните. Вес лёгкий, поставьте гриф на стойку подконтрольно." }
load_step_kg = 2.5
