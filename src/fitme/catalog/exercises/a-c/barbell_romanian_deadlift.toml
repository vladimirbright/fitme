instructions = { en = "Hold the bar at hip height, feet hip-width. Push your hips back, keeping the bar close to your legs and knees only slightly bent, until you feel a stretch in the hamstrings. Drive the hips forward to stand back up. Leave a couple of reps in reserve rather than grinding out the last one.", ru = "Держите штангу на уровне бёдер, ноги на ширине таза. Отведите таз назад, гриф скользит вдоль ног, колени чуть согнуты, пока не почувствуете растяжение задней поверхности бедра. Верните таз вперёд, чтобы встать. Оставляйте пару повторений в запасе, не доводите подход до отказа." }
