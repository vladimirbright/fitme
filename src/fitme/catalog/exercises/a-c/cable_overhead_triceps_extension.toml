id = "cable_overhead_triceps_extension"
names = { en = "Cable overhead triceps extension", ru = "Разгибания рук над головой в блоке" }
kind = "isolation"
pattern = "accessory"
equipment = ["cable"]
load_unit = "total"
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current"]
