instructions = { en = "Set the lightest resistance on a high pulley with a rope. Turn your back to the stack in a split stance, rope held above your head, upper arms beside your ears. Let your hands travel back by bending only at the elbows, as far as feels comfortable, then straighten the arms. Keep your ribs down and avoid arching your lower back.", ru = "Установите минимальное сопротивление на верхнем блоке с канатной рукоятью. Встаньте спиной к блоку в разножку, канат над головой, плечи у ушей. Сгибая только локти, отведите кисти назад настолько, насколько комфортно, затем выпрямите руки. Не прогибайтесь в пояснице." }
load_step_kg = 1.0
