instructions = { en = "Lie on the bench, feet flat on the floor, bar over your chest. Unrack, lower the bar to the mid-chest with elbows at roughly 45 degrees, then press it back up. Set the rack's safety arms just below the lowest point of the movement. Pause briefly on the chest instead of bouncing the bar up.", ru = "Лягте на скамью, стопы на полу, гриф над грудью. Снимите штангу со стойки, опустите к середине груди, локти под углом примерно 45 градусов, затем выжмите обратно вверх. Установите страховочные упоры чуть ниже нижней точки движения. Делайте короткую паузу на груди вместо отбива штанги вверх." }
