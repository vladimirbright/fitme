instructions = { en = "Start in a push-up position on a firm, non-slip floor. Lower the chest toward the floor, then press up hard enough that the hands leave the floor and clap briefly. Land with soft, slightly bent elbows and go straight into the next rep. Stop the set when the push loses height.", ru = "Исходное положение для отжиманий на твёрдом нескользком полу. Опуститесь грудью к полу, затем мощно оттолкнитесь так, чтобы ладони оторвались от пола, и коротко хлопните. Приземляйтесь на мягкие, слегка согнутые руки и сразу переходите к следующему повтору. Завершайте подход, когда толчок теряет высоту." }
