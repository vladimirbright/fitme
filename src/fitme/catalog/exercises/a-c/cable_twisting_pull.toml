instructions = { en = "Stand facing a low pulley, feet shoulder-width, knees soft, one arm extended on the handle. Pull the handle to your side and rotate the torso slightly away at the end. Return slowly to square and keep the rotation small. Switch sides after each set.", ru = "Встаньте лицом к нижнему блоку, ноги на ширине плеч, колени слегка согнуты, рука с рукоятью вытянута. Тяните рукоять к боку и в конце слегка поверните корпус. Медленно вернитесь в исходное положение, поворот небольшой. После подхода смените сторону." }
