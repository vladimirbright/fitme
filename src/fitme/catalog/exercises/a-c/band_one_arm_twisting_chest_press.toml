instructions = { en = "Anchor the band at chest height and stand side-on to the anchor, feet shoulder-width apart and knees slightly bent. Hold the band at the opposite shoulder, then press the hand forward and across while turning the torso a little. Return slowly. Do all reps on one side, then switch.", ru = "Закрепите ленту на уровне груди и встаньте боком к креплению, ноги на ширине плеч, колени слегка согнуты. Держите ленту у противоположного плеча, затем выжимайте руку вперёд и поперёк корпуса с небольшим поворотом. Медленно вернитесь. Все повторы на одну сторону, затем смените." }
