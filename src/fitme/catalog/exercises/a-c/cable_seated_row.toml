instructions = { en = "Sit at the low cable with feet on the footplates, knees slightly bent, and hold the handle with arms extended. Keep your chest tall and your back flat. Pull the handle to your lower ribs, drawing the elbows back, then return slowly without rounding forward. Avoid swinging the torso to move the weight.", ru = "Сядьте у нижнего блока, ступни на упорах, колени слегка согнуты, руки вытянуты к рукояти. Грудь раскрыта, спина прямая. Тяните рукоять к низу рёбер, отводя локти назад, затем медленно возвращайте, не округляя спину. Не раскачивайте корпус, чтобы сдвинуть вес." }
