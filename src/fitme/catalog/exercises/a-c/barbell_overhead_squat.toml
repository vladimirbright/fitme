instructions = { en = "Unrack the bar onto the front shoulders, step back and press it overhead with a wide grip and locked arms. Squat with the bar stacked over the mid-foot, then stand. Start very light, keep clear space around you, and if the bar drifts forward, step back and let it drop in front.", ru = "Снимите штангу на передние дельты, отойдите и выжмите её над головой широким хватом на прямых руках. Присядьте так, чтобы штанга оставалась над серединой стопы, затем встаньте. Начинайте с очень лёгкого веса, вокруг должно быть свободно; если штанга уходит вперёд, шагните назад и сбросьте её перед собой." }
