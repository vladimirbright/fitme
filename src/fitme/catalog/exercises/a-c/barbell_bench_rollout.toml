instructions = { en = "Place a bar with small plates on the floor in front of a flat bench. Kneel on the bench and grip the bar shoulder-width, arms straight. Roll the bar forward only as far as your back stays flat, then pull it back toward the bench. Keep your trunk braced and the plates clear of the bench.", ru = "Положите гриф с небольшими блинами на пол перед плоской скамьёй. Встаньте на колени на скамью, хват на ширине плеч, руки прямые. Прокатывайте гриф вперёд, пока спина остаётся ровной, затем верните его к скамье. Корпус напряжён, блины не должны задевать скамью." }
