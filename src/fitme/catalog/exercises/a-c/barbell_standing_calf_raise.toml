instructions = { en = "Set the bar on the rack at shoulder height, step under it, unrack and take a small step back. Feet hip-width. Rise onto the balls of your feet, pause, then lower your heels slowly. Re-rack the bar before you step away.", ru = "Установите штангу на стойке на высоте плеч, зайдите под неё, снимите со стойки и сделайте небольшой шаг назад. Ноги на ширине таза. Поднимитесь на носки, задержитесь и медленно опустите пятки. Верните штангу на стойку, прежде чем отойти." }
