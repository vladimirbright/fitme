instructions = { en = "Rest the bar across the front of your shoulders, elbows lifted, fingertips light on the bar. Feet shoulder-width. Sit down and back, torso upright and elbows up, until your thighs are at least parallel to the floor. Stand back up through the whole foot. Set the rack's safety arms just below the lowest point of the movement.", ru = "Расположите штангу на передних дельтах, локти подняты вперёд, пальцы слегка придерживают гриф. Ноги на ширине плеч. Присядьте вниз и назад, корпус вертикально, локти вверх, до параллели бёдер с полом или ниже. Встаньте, отталкиваясь всей стопой. Установите страховочные упоры чуть ниже нижней точки движения." }
