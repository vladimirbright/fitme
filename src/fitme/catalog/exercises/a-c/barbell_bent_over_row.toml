instructions = { en = "Hinge forward at the hips with a flat back, bar hanging at arm's length. Pull the bar toward your lower ribs, squeezing the shoulder blades together, then lower it under control. Keep the working weight clearly below your squat; a bent-over hinge already asks a lot from the lower back.", ru = "Наклонитесь вперёд в тазобедренном суставе, спина прямая, гриф на вытянутых руках. Подтяните гриф к низу груди, сводя лопатки, затем опустите под контролем. Держите рабочий вес заметно ниже приседа — поясница и так активно работает в наклоне." }
