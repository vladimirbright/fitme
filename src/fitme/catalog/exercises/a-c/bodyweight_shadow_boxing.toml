instructions = { en = "Stand in your boxing stance with hands up and chin down, with clear space around you. For the whole round, move on the balls of your feet (steps forward, back, to the sides and pivots) and throw light combinations: jabs, crosses, hooks and uppercuts, returning the hands to guard after every punch. Keep the punches relaxed and fast, never snap the elbow straight, and breathe out with each punch.", ru = "Встаньте в боевую стойку: руки у лица, подбородок опущен, вокруг свободное место. Весь раунд двигайтесь на передней части стопы (шаги вперёд, назад, в стороны, развороты) и наносите лёгкие серии ударов: прямые, боковые и снизу, после каждого удара возвращая руки к лицу. Бейте расслабленно и быстро, не выпрямляйте локоть рывком, на каждом ударе выдыхайте." }
