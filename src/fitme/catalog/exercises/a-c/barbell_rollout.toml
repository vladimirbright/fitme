instructions = { en = "Load the bar with small plates, kneel on a pad and grip it shoulder-width. Roll forward only as far as you can keep your back flat, then pull back to your knees. Stop short of full extension. Brace your trunk and keep the plates clear of your legs.", ru = "Нагрузите гриф небольшими блинами, встаньте на колени на мат, хват на ширине плеч. Выкатывайтесь вперёд лишь пока спина остаётся ровной, затем вернитесь к коленям. Не доходите до полного разгибания. Напрягите корпус, блины не должны задевать ноги." }
