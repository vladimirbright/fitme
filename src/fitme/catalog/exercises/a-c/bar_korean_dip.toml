instructions = { en = "Set an empty barbell on the rack's safety arms at about hip height and stand with your back to it. Grip it shoulder-width and press up to straight arms, legs out in front. Bend the elbows and let the body move forward as the bar slides up behind you, only as deep as the shoulders stay comfortable, then press back up. Keep the shoulders down and move slowly.", ru = "Положите пустой гриф на страховочные упоры рамы примерно на уровне бёдер и встаньте к нему спиной. Возьмитесь за гриф на ширине плеч и выйдите в упор на прямых руках, ноги вытянуты вперёд. Сгибайте локти, позволяя корпусу смещаться вперёд, а грифу подниматься вдоль спины, только до комфортной для плеч глубины, затем выжмитесь вверх. Плечи опущены, двигайтесь медленно." }
