instructions = { en = "Lock the Smith machine bar on its hooks at about hip height and stand with your back to it. Grip it shoulder-width behind you and press up to straight arms, legs out in front. Bend the elbows and let the body move forward and down in front of the bar, only as deep as the shoulders stay comfortable, then press back up. Keep the shoulders down and move slowly.", ru = "Зафиксируйте гриф тренажёра Смита на крюках примерно на уровне бёдер и встаньте к нему спиной. Возьмитесь за гриф за спиной на ширине плеч и выйдите в упор на прямых руках, ноги вытянуты вперёд. Сгибайте локти, позволяя корпусу смещаться вперёд и вниз перед грифом, только до комфортной для плеч глубины, затем выжмитесь вверх. Плечи опущены, двигайтесь медленно." }
