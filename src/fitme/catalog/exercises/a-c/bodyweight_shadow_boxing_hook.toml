instructions = { en = "Stand in a staggered stance with knees soft and hands up. Pivot on your lead foot and turn your hips as the lead arm swings around in a bent-elbow arc at shoulder height, then return to guard. Keep the movement smooth, do not lock the elbow at the end, and have clear space in front of you.", ru = "Встаньте в полубоковую стойку, колени слегка согнуты, руки у лица. Повернитесь на передней стопе и разверните таз, проводя переднюю руку по дуге с согнутым локтем на уровне плеча, затем вернитесь в стойку. Движение плавное, локоть в конце не выпрямляйте; впереди должно быть свободное место." }
