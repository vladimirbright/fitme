id = "barbell_reverse_lunge"
names = { en = "Barbell reverse lunge", ru = "Выпады назад со штангой" }
kind = "compound"
pattern = "squat"
measures = ["reps"]
qualities = ["strength", "hypertrophy"]
unilateral = true
equipment = ["barbell", "rack"]
load_unit = "total"
