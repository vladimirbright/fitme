instructions = { en = "Kneel behind a flat bench with your forearms along the pad, palms down, and your wrists just past the far edge, holding the bar shoulder-width. Raise the backs of your hands by bending only the wrists, then lower slowly. Keep the load light.", ru = "Встаньте на колени за горизонтальной скамьёй, предплечья лежат вдоль неё ладонями вниз, кисти чуть за дальним краем, гриф на ширине плеч. Поднимайте тыльную сторону кистей, сгибая только запястья, и медленно опускайте. Вес берите небольшой." }
