instructions = { en = "Lock the Smith machine bar on its hooks at about waist height. Hang a plate from a dip belt and support yourself on the bar, hands on it in front. Lower by bending the elbows to about 90 degrees, then press up. Keep the movement slow and do not drop into the bottom.", ru = "Зафиксируйте гриф тренажёра Смита на крюках примерно на уровне пояса. Подвесьте блин на пояс для отягощений и обопритесь на гриф, руки впереди. Опуститесь, сгибая локти примерно до 90 градусов, затем выжмитесь вверх. Двигайтесь медленно, не проваливайтесь в нижней точке." }
load_step_kg = 2.5
