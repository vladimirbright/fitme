id = "weight_plate_dip"
names = { en = "Weighted parallel bar dip", ru = "Отжимания на брусьях с отягощением" }
kind = "bodyweight"
level = "advanced"
pattern = "vertical_push"
equipment = ["dip_bars", "weight_plate"]
load_unit = "total"
locations = ["public_gym", "studio_gym", "home_equipment"]
