instructions = { en = "Hold a plate between the thighs or on a belt and support yourself on parallel bars with straight arms. Lower until the upper arms are about parallel to the floor, then press up. Start with a light load.", ru = "Закрепите блин на поясе или зажмите между бёдер, обопритесь на брусья на прямых руках. Опуститесь до положения плеч примерно параллельно полу, затем выжмитесь вверх. Начните с небольшого веса." }
load_step_kg = 2.5
