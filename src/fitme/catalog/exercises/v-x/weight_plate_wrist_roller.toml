id = "weight_plate_wrist_roller"
names = { en = "Weight plate wrist roller", ru = "Кистевой ролик с блином" }
kind = "isolation"
pattern = "accessory"
equipment = ["weight_plate"]
load_unit = "total"
locations = ["public_gym", "studio_gym", "home_equipment"]
