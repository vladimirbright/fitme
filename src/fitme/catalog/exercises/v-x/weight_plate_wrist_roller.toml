instructions = { en = "Tie a rope to a handle bar and attach a light plate to the other end of the rope. Stand with the arms extended in front and roll the rope up by turning the wrists, then lower the plate slowly. Use a light load and keep the shoulders relaxed.", ru = "Привяжите верёвку к ручке и закрепите на другом конце лёгкий блин. Встаньте, руки вытянуты вперёд, наматывайте верёвку вращением запястий, затем медленно опустите блин. Берите небольшой вес, плечи расслаблены." }
