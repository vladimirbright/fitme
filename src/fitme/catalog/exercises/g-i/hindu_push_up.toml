instructions = { en = "Start with hips high and hands a little wider than shoulders. Bend the elbows and sweep the chest forward close to the floor. Extend the arms as the chest rises and the hips move toward the floor, without forcing an arch in the lower back. Then push the hips back and up to the starting position. Move smoothly throughout.", ru = "Начните с высоко поднятым тазом и ладонями чуть шире плеч. Согните локти и плавно проведите грудь вперёд близко к полу. Выпрямите руки, поднимая грудь и опуская таз к полу, не усиливая прогиб в пояснице. Затем отведите таз назад и вверх в исходное положение. Двигайтесь плавно." }
