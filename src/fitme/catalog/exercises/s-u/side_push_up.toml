instructions = { en = "Lie on your side with legs stacked and knees slightly bent, the bottom arm wrapped around the torso. Place the top palm flat on the floor beside the bottom elbow, fingers toward the head. Press into the floor with the top arm to lift the upper body until the elbow is nearly straight, then lower slowly to just above parallel. Finish all reps, then switch sides.", ru = "Лягте на бок, ноги вместе и слегка согнуты в коленях, нижняя рука обхватывает корпус. Поставьте ладонь верхней руки на пол рядом с нижним локтем, пальцы направлены к голове. Давите верхней рукой в пол, поднимая верхнюю часть тела почти до выпрямления локтя, затем медленно опуститесь чуть выше параллели с полом. Выполните все повторения и смените сторону." }
