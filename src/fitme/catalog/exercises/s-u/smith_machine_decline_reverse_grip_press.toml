id = "smith_machine_decline_reverse_grip_press"
names = { en = "Smith machine decline reverse-grip press", ru = "Жим в Смите головой вниз обратным хватом" }
kind = "compound"
pattern = "horizontal_push"
equipment = ["smith_machine", "bench"]
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "calibration" }
instructions = { en = "Set a decline bench under the bar and hook your feet securely. Take an underhand grip about shoulder width, unhook and lower the bar to the lower chest with elbows close, then press up. Keep the wrists stacked over the forearms and set the safety stops low.", ru = "Установите скамью с отрицательным наклоном и надёжно зафиксируйте ноги. Хват снизу примерно на ширине плеч, снимите гриф, опустите к нижней части груди с локтями близко к корпусу и выжмите вверх. Запястья над предплечьями, ограничители установите низко." }
load_step_kg = 2.5
