instructions = { en = "Set an incline bench under the bar so the bar is over your shoulders, and set the safety stops just below the lowest bar position. Lie back, hold the bar with straight arms and unhook it. Keeping the elbows straight, reach the bar toward the ceiling by spreading the shoulder blades, then let them draw back together. The bar travels only a few centimetres.", ru = "Установите наклонную скамью под гриф так, чтобы он был над плечами, а ограничители — чуть ниже нижней точки движения. Лягте, возьмите гриф прямыми руками и снимите с фиксаторов. Не сгибая локти, тянитесь грифом к потолку, разводя лопатки, затем сведите их обратно. Гриф проходит всего несколько сантиметров." }
