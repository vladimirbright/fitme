id = "smith_machine_reverse_grip_bench_press"
names = { en = "Smith machine reverse-grip bench press", ru = "Жим лёжа обратным хватом в Смите" }
kind = "compound"
pattern = "horizontal_push"
equipment = ["smith_machine", "bench"]
load_unit = "total"
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "calibration" }
instructions = { en = "Slide a flat bench under the bar and lie back with feet flat. Take an underhand grip about shoulder width, unhook and lower the bar to the lower chest with elbows close to the body, then press up. Keep the wrists straight and set the safety stops just below the lowest bar position.", ru = "Подвиньте горизонтальную скамью под гриф и лягте, стопы на полу. Возьмитесь хватом снизу примерно на ширине плеч, снимите гриф и опустите к нижней части груди, локти близко к корпусу, затем выжмите вверх. Запястья прямые, ограничители установите чуть ниже нижней точки." }
load_step_kg = 2.5
