instructions = { en = "Hang from a bar with a firm grip. Tuck the knees up and rotate backward until the hips pass through the arms and the body hangs inverted behind you, then lower the feet toward the floor at a slow pace. Reverse the same path to come back. Stay within a range you control and keep the floor clear.", ru = "Повисните на перекладине, хват надёжный. Подтяните колени и вращайтесь назад, пока таз не пройдёт между руками и тело не окажется перевёрнутым за перекладиной, затем медленно опустите стопы к полу. Вернитесь тем же путём в обратном порядке. Работайте в подконтрольной амплитуде, место под вами свободно." }
