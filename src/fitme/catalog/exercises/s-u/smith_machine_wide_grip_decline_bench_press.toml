id = "smith_machine_wide_grip_decline_bench_press"
names = { en = "Smith machine wide-grip decline bench press", ru = "Жим в Смите головой вниз широким хватом" }
kind = "compound"
pattern = "horizontal_push"
equipment = ["smith_machine", "bench"]
locations = ["public_gym", "studio_gym"]
