instructions = { en = "Set a decline bench under the bar and hook your feet securely. Take a grip clearly wider than shoulders, unhook and lower the bar to the lower chest, then press up. Set the safety stops below the lowest bar position.", ru = "Установите скамью с отрицательным наклоном и надёжно зафиксируйте ноги. Хват заметно шире плеч, снимите гриф, опустите к нижней части груди и выжмите вверх. Ограничители установите ниже нижней точки." }
load_step_kg = 2.5
