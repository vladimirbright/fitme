instructions = { en = "Lie on a flat bench under the bar with hips and knees bent and feet on the bar. Release the hooks and lower the knees toward the chest only as far as the lower back stays on the bench, then press up. Keep the feet flat and centred on the bar, and set the safety stops so the bar cannot reach your body.", ru = "Лягте на скамью под гриф, бёдра и колени согнуты, стопы на грифе. Снимите гриф с крючков и опускайте колени к груди, пока поясница прижата к скамье, затем выжмите вверх. Держите стопы ровно по центру грифа и выставьте ограничители так, чтобы гриф не достал до тела." }
