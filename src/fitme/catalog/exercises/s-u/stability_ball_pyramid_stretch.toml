instructions = { en = "Sit on the ball, then walk the feet forward and lie back until the ball sits under the lower and middle back. Keep the feet wide and flat, let the arms open to the sides and the head rest back toward the ball, and relax for 20-30 seconds. Walk the feet back in to sit up slowly.", ru = "Сядьте на фитбол, пройдите стопами вперёд и откиньтесь назад, чтобы мяч оказался под поясницей и серединой спины. Стопы широко и плотно на полу, руки разведите в стороны, голову опустите назад к мячу и расслабьтесь на 20-30 секунд. Чтобы сесть, медленно переступите стопами обратно." }
