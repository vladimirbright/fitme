start = { kind = "calibration" }
instructions = { en = "Place a stable block or plate under the bar and set the bar at shoulder height. Step under it with the bar across the upper back, balls of the feet on the block and heels free. Unhook, lower the heels for a gentle stretch, rise as high as you can, then lower slowly. Re-hook the bar before stepping off.", ru = "Поставьте под гриф устойчивую подставку или блин и установите гриф на уровне плеч. Встаньте под него, гриф на верхней части спины, передняя часть стоп на подставке, пятки свободны. Снимите гриф с фиксаторов, опустите пятки до лёгкого растяжения, поднимитесь как можно выше и медленно опуститесь. Верните гриф на фиксаторы, прежде чем сойти с подставки." }
