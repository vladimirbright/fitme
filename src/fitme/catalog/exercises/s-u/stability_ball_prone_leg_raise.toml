instructions = { en = "Walk out on the hands until the shins rest on the ball, hands under the shoulders and the body straight. Lift one leg a short way off the ball, hold briefly, lower it and switch legs. Keep the abdomen braced so the lower back does not sag, and walk back in when the form slips.", ru = "Пройдите на руках вперёд, пока голени не окажутся на фитболе, ладони под плечами, тело прямое. Приподнимите одну ногу над мячом на небольшую высоту, ненадолго задержитесь, опустите и смените ногу. Живот напряжён, поясница не провисает; когда техника теряется, вернитесь назад." }
