instructions = { en = "Set an empty barbell on the rack's safety arms at about waist height and support yourself on it, bar in front of the hips and arms straight. Lean slightly forward and bend the elbows to lower the chest toward the bar, about to a right angle at the elbows. Press back up and avoid swinging the legs.", ru = "Положите пустой гриф на страховочные упоры рамы примерно на уровне пояса и обопритесь на него, гриф перед тазом, руки прямые. Слегка наклонитесь вперёд и сгибайте локти, опуская грудь к грифу примерно до прямого угла в локтях. Выжмитесь обратно, ноги не раскачивайте." }
