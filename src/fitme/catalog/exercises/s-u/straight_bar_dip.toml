instructions = { en = "Support yourself on a fixed straight bar at about waist height, bar in front of the hips and arms straight. Lean slightly forward and bend the elbows to lower the chest toward the bar, about to a right angle at the elbows. Press back up and avoid swinging the legs.", ru = "Обопритесь на закреплённую прямую перекладину примерно на уровне пояса, перекладина перед тазом, руки прямые. Слегка наклонитесь вперёд и сгибайте локти, опуская грудь к перекладине примерно до прямого угла в локтях. Выжмитесь обратно, ноги не раскачивайте." }
