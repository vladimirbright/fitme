instructions = { en = "Lock the Smith machine bar on its hooks at about waist height and support yourself on it, bar in front of the hips and arms straight. Lean slightly forward and bend the elbows to lower the chest toward the bar, about to a right angle at the elbows. Press back up and avoid swinging the legs.", ru = "Зафиксируйте гриф тренажёра Смита на крюках примерно на уровне пояса и обопритесь на него, гриф перед тазом, руки прямые. Слегка наклонитесь вперёд и сгибайте локти, опуская грудь к грифу примерно до прямого угла в локтях. Выжмитесь обратно, ноги не раскачивайте." }
