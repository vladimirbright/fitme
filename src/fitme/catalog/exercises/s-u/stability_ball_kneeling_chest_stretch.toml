instructions = { en = "Kneel beside a stability ball and rest one forearm on top of it, elbow about level with the shoulder. Let the chest sink slowly toward the floor until you feel a mild pull across the chest. Hold 20-30 seconds without bouncing, then switch sides.", ru = "Встаньте на колени рядом с фитболом и положите на него предплечье, локоть примерно на уровне плеча. Медленно опускайте грудь к полу до лёгкого натяжения в груди. Удерживайте 20-30 секунд без пружинящих движений, затем смените сторону." }
