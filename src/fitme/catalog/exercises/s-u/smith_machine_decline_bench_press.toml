start = { kind = "calibration" }
instructions = { en = "Set a decline bench under the bar and hook your feet securely. Take a grip slightly wider than shoulders, unhook and lower the bar to the lower chest, then press up. Set the safety stops just below the lowest bar position.", ru = "Установите скамью с отрицательным наклоном под гриф и надёжно зафиксируйте ноги. Хват чуть шире плеч, снимите гриф, опустите к нижней части груди и выжмите вверх. Установите ограничители чуть ниже нижней точки." }
load_step_kg = 2.5
