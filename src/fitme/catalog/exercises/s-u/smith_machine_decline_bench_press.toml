id = "smith_machine_decline_bench_press"
names = { en = "Smith machine decline bench press", ru = "Жим лёжа головой вниз в Смите" }
kind = "compound"
pattern = "horizontal_push"
equipment = ["smith_machine", "bench"]
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
