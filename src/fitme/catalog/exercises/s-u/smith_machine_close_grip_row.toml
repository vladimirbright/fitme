instructions = { en = "Set the safety stops just below the lowest point of the row. Hold the bar with hands about shoulder width or closer, and hinge forward with a flat back. Pull the bar toward the lower ribs, keeping the elbows near the body. Lower under control.", ru = "Установите страховочные упоры чуть ниже нижней точки тяги. Возьмите гриф узким хватом, не шире плеч, и наклонитесь с прямой спиной. Тяните гриф к нижним рёбрам, локти близко к корпусу. Опустите под контролем." }
