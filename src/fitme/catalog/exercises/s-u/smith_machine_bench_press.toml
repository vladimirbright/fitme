id = "smith_machine_bench_press"
names = { en = "Smith machine bench press", ru = "Жим лёжа в Смите" }
kind = "compound"
pattern = "horizontal_push"
measures = ["reps"]
qualities = ["strength", "hypertrophy"]
equipment = ["smith_machine", "bench"]
locations = ["public_gym", "studio_gym"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current", "hernia"]
increment_kg = 2.5
start = { kind = "calibration" }
instructions = { en = "Slide the bench under the bar, lie back with feet flat and take a grip slightly wider than shoulders. Unhook and lower the bar to the mid chest, elbows near 45 degrees, then press up. Set the safety stops just below the lowest bar position and re-hook the bar when finished.", ru = "Подвиньте скамью под гриф, лягте, стопы на полу, хват чуть шире плеч. Снимите гриф с фиксаторов, опустите к середине груди, локти под углом около 45 градусов, и выжмите вверх. Установите ограничители чуть ниже нижней точки и зафиксируйте гриф в конце." }
load_step_kg = 2.5
