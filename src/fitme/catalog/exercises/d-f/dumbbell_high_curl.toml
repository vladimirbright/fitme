instructions = { en = "Stand tall and raise your arms out to the sides to shoulder height, a light dumbbell in each hand, palms up. Bend the elbows to bring the weights toward your head, then straighten the arms again. Keep the elbows level with the shoulders and avoid leaning back.", ru = "Встаньте прямо и разведите руки в стороны до уровня плеч, в руках лёгкие гантели, ладони вверх. Сгибайте локти, приближая гантели к голове, затем снова выпрямите руки. Локти держите на уровне плеч, не отклоняйтесь назад." }
