id = "dumbbell_one_leg_stability_ball_fly"
names = { en = "One-leg dumbbell fly on stability ball", ru = "Разводка гантелей на фитболе на одной ноге" }
kind = "isolation"
pattern = "accessory"
equipment = ["dumbbells", "stability_ball"]
level = "advanced"
load_unit = "per_implement"
locations = ["public_gym", "studio_gym", "home_equipment"]
