id = "deep_push_up"
names = { en = "Deep push-up", ru = "Глубокие отжимания" }
kind = "bodyweight"
pattern = "horizontal_push"
equipment = ["dumbbells"]
# Two fixed hex dumbbells are the raised handles; no kg load is prescribed (bodyweight start).
load_unit = "per_implement"
locations = ["public_gym", "studio_gym", "home_equipment"]
loads_areas = ["shoulder", "elbow_wrist"]
contraindicated_by = ["shoulder_injury_current", "elbow_wrist_injury_current"]
increment_kg = 1.0
start = { kind = "bodyweight" }
instructions = { en = "Place each hand on a sturdy raised grip, such as parallettes or fixed hex dumbbells, with the body in a straight line. Lower the chest slowly between the hands, elbows close to the sides, then press back up. Use only a depth that feels stable at the shoulders.", ru = "Поставьте каждую ладонь на устойчивую приподнятую опору, например паралетты или неподвижные гексагональные гантели, тело прямой линией. Медленно опустите грудь между опорами, локти у корпуса, затем выжмитесь вверх. Глубина только та, при которой плечи остаются устойчивыми." }
