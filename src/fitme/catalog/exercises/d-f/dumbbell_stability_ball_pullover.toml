instructions = { en = "Lie back on a stability ball with your head and upper back supported, feet wide, hips level. Hold one dumbbell with both hands above your chest, elbows slightly bent. Lower it in an arc behind your head only as far as is comfortable, then bring it back over your chest. Use a light weight.", ru = "Лягте на фитбол: голова и верх спины опираются на мяч, ноги широко, таз на уровне корпуса. Одну гантель держите двумя руками над грудью, локти слегка согнуты. Опустите её по дуге за голову в комфортной амплитуде и верните над грудью. Вес лёгкий." }
