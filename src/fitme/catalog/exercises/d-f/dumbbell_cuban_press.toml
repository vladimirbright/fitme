instructions = { en = "Stand holding light dumbbells at your sides. Pull them up to shoulder height with elbows high, rotate your forearms up so the dumbbells are overhead, press to full extension, then reverse the path under control. Keep the weight light.", ru = "Встаньте с лёгкими гантелями вдоль тела. Подтяните их к уровню плеч, локти высоко, разверните предплечья вверх, чтобы гантели оказались над головой, выжмите до выпрямления рук, затем в обратном порядке под контролем верните. Вес лёгкий." }
