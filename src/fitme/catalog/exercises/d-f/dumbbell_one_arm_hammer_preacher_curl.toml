instructions = { en = "Set a bench to a steep incline and stand or kneel behind it, chest against the top of the backrest, one upper arm resting on the pad and the dumbbell held with the palm facing in. Curl up without lifting the arm off the pad, then lower to a nearly straight arm. Switch sides after the set.", ru = "Установите скамью под крутым наклоном, встаньте или опуститесь на колени позади неё, грудью к верху спинки; одно плечо лежит на спинке, гантель в нейтральном хвате. Согните руку, не отрывая плечо от упора, затем опустите почти до выпрямления. После подхода смените руку." }
