instructions = { en = "Lie lengthwise on a flat bench, head supported and feet on the floor. Hold one dumbbell with both hands above your chest, arms nearly straight. Lower it in an arc behind your head only as far as is comfortable, keeping your lower back on the bench, then bring it back over your chest. Use a light weight.", ru = "Лягте вдоль горизонтальной скамьи, голова на скамье, стопы на полу. Одну гантель держите двумя руками над грудью, руки почти прямые. Опустите её по дуге за голову в комфортной амплитуде, поясница прижата к скамье, затем верните над грудью. Вес лёгкий." }
