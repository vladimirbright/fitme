instructions = { en = "Kneel on the floor with both hands on the roller in front of you. Roll it forward, sitting your hips back until you feel the sides of your back lengthen. Hold briefly, then roll back. Keep the movement slow and within a comfortable range.", ru = "Встаньте на колени, обе руки на ролле перед собой. Откатите ролл вперёд, отводя таз назад, пока не почувствуете растяжение по бокам спины. Задержитесь, затем верните ролл. Двигайтесь медленно в комфортной амплитуде." }
