id = "ez_bar_close_grip_bench_press"
names = { en = "EZ-bar close-grip bench press", ru = "Жим EZ-грифа лёжа узким хватом" }
kind = "compound"
pattern = "horizontal_push"
measures = ["reps"]
qualities = ["strength", "hypertrophy"]
equipment = ["ez_bar", "rack", "bench"]
load_unit = "total"
