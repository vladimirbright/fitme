instructions = { en = "Stand with feet shoulder-width apart and one dumbbell raised overhead in one hand, upper arm close to your head. Bend the elbow to lower the weight behind your head, then straighten the arm. Steady the working arm with your free hand if needed. Use a light weight.", ru = "Встаньте, ноги на ширине плеч, гантель в одной руке поднята над головой, плечо рядом с головой. Согните локоть, опуская гантель за голову, затем выпрямите руку. При необходимости придерживайте рабочую руку свободной. Берите небольшой вес." }
