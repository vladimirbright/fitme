instructions = { en = "Sit on a stability ball and walk your feet forward until your head and upper back rest on it, hips level with your knees. Hold one dumbbell in both hands above your chest. Bend the elbows to lower it behind your head with the upper arms pointing up, then straighten the arms. Use a light weight and keep it clear of your face.", ru = "Сядьте на фитбол и переступите стопами вперёд, пока голова и верх спины не лягут на мяч, таз на уровне коленей. Держите одну гантель двумя руками над грудью. Согните локти, опуская её за голову, плечи смотрят вверх, затем выпрямите руки. Вес небольшой, гантель держите вдали от лица." }
