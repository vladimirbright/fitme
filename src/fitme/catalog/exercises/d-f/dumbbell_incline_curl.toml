instructions = { en = "Sit on a bench set to about 45 degrees, back and head resting against it, a dumbbell in each hand hanging straight down. Curl the dumbbells toward your shoulders without moving your elbows, then lower under control. If the shoulder feels tight, raise the backrest a little.", ru = "Сядьте на скамью, установленную примерно под 45 градусов, спина и затылок прижаты, гантели свободно свисают вниз. Сгибайте руки, поднимая гантели к плечам, не двигая локтями, затем опускайте под контролем. Если тянет плечо — увеличьте угол наклона спинки." }
