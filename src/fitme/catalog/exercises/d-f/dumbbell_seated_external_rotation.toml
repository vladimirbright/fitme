instructions = { en = "Sit on a bench with the foot of the working side up on it and rest that elbow on the knee, bent 90 degrees, a light dumbbell in the hand and the forearm pointing forward. Turn the forearm up until it is vertical, keeping the elbow in place, then lower slowly. Finish one side, then switch.", ru = "Сядьте на скамью, поставьте на неё стопу рабочей стороны и обопритесь локтем о колено; локоть согнут под 90 градусов, в руке лёгкая гантель, предплечье направлено вперёд. Поднимите предплечье до вертикали, не сдвигая локоть, затем медленно опустите. Выполните все повторения одной рукой, затем смените." }
