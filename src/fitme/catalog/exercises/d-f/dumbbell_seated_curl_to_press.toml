instructions = { en = "Sit upright on a bench with a dumbbell in each hand, palms forward. Curl both weights to shoulder height, then press them overhead until your arms are straight. Lower to the shoulders and then back down to the start under control. Use a light weight and keep your ribs down.", ru = "Сядьте ровно на скамью, в руках гантели ладонями вперёд. Согните руки, подняв гантели к плечам, затем выжмите их вверх до выпрямления рук. Опустите к плечам и далее вниз под контролем. Берите небольшой вес, рёбра не разводите." }
