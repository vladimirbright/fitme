instructions = { en = "Stand behind an incline bench set to a steep angle, feet wide and chest braced against the top of the backrest. Rest one upper arm over the pad with a dumbbell held palm up. Curl the weight toward your shoulder with the upper arm still, then lower under control. Finish all reps, then switch arms.", ru = "Встаньте позади наклонной скамьи, установленной под крутым углом, ноги широко, грудью упритесь в верх спинки. Одно плечо лежит на спинке, в руке гантель ладонью вверх. Согните руку, поднимая гантель к плечу, плечо неподвижно, затем опустите под контролем. Выполните все повторения и смените руку." }
