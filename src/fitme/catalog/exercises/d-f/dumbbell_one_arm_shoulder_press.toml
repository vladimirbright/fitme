instructions = { en = "Stand with feet shoulder-width apart, one dumbbell at shoulder height, palm forward. Brace your midsection and press straight up until your arm is extended, then lower to your shoulder. Do all reps, then switch arms. Don't lean sideways.", ru = "Встаньте, ноги на ширине плеч, гантель у плеча, ладонь вперёд. Напрягите корпус и выжмите гантель вверх до выпрямления руки, затем опустите к плечу. Выполните все повторения, затем смените руку. Не наклоняйтесь в сторону." }
