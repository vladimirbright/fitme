instructions = { en = "Stand with a stability ball between your lower back and a wall, a dumbbell in each hand at your sides, feet hip-width. Hold a rolled towel between your knees without pressing them hard together. Rise onto the balls of your feet while keeping the towel in place, pause, then lower the heels slowly. Keep light pressure on the stability ball.", ru = "Встаньте так, чтобы фитбол был между поясницей и стеной, в руках по гантели вдоль корпуса, ноги на ширине таза. Удерживайте свёрнутое полотенце между коленями, не сжимая их сильно. Поднимитесь на носки, не выпуская полотенце, задержитесь и медленно опустите пятки. Слегка прижимайтесь к фитболу." }
