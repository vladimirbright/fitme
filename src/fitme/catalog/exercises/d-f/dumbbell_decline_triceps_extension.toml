instructions = { en = "Lie on a decline bench, feet secured, dumbbells held above your chest with palms facing each other. Bend only the elbows to lower the weights beside your head, then extend back up. Use a light weight with a firm grip and keep the bench angle shallow.", ru = "Лягте на скамью с наклоном вниз, ноги закреплены, гантели над грудью, ладони смотрят друг на друга. Сгибайте только локти, опуская гантели по сторонам от головы, затем разогните руки. Вес лёгкий, хват крепкий, наклон скамьи небольшой." }
