instructions = { en = "Sit with knees bent and the roller across your back under the shoulder blades, hands behind your head. Roll slowly up and down the upper back by pushing with the feet. Stay above the lower back and keep the movement slow.", ru = "Сядьте, колени согнуты, ролл лежит поперёк спины под лопатками, руки за головой. Медленно перекатывайтесь вверх и вниз по верхней части спины, отталкиваясь стопами. Не опускайтесь на поясницу, двигайтесь плавно." }
