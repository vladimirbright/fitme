instructions = { en = "Lie back on a stability ball with your upper back supported and feet wide. Hold one dumbbell with both hands above your chest. Lower it behind your head within a comfortable range, bring it back, then lift your hips into a straight line with your torso and lower them again. Use a light weight.", ru = "Лягте на фитбол верхней частью спины, ноги широко. Одну гантель держите двумя руками над грудью. Опустите её за голову в комфортной амплитуде, верните, затем поднимите таз до одной линии с корпусом и опустите. Вес лёгкий." }
