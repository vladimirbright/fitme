instructions = { en = "Support your knee and hand on a bench, back flat. Row the dumbbell up to your hip, elbow close to your body, then lower it under control. Complete all reps on one side before switching. Keep the torso still — no twisting to help the weight up.", ru = "Обопритесь коленом и рукой о скамью, спина прямая. Подтяните гантель к бедру, локоть близко к корпусу, затем опустите под контролем. Выполните все повторения на одну сторону, затем смените. Корпус неподвижен — не скручивайтесь, помогая себе поднять вес." }
