instructions = { en = "Hold a dumbbell in each hand facing a low bench. Step up with one foot, bring the other beside it, then step back down to the floor one foot at a time. Take a long step back with the leg that led into a reverse lunge, then return to standing. Move slowly and switch the leading leg each rep.", ru = "Гантели в руках, встаньте лицом к низкой скамье. Поднимитесь на неё одной ногой, приставьте вторую, затем по одной сойдите на пол. Ведущей ногой сделайте широкий шаг назад в выпад и вернитесь в стойку. Двигайтесь медленно и меняйте ведущую ногу в каждом повторении." }
