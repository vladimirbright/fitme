instructions = { en = "Set a bench to a steep incline and stand or kneel behind it, chest against the top of the backrest, one upper arm resting on the pad and the dumbbell held palm up. Curl the weight toward your shoulder, then lower until the arm is nearly straight, under control. Finish all reps, then switch arms.", ru = "Установите скамью под крутым наклоном, встаньте или опуститесь на колени позади неё, грудью к верху спинки; одно плечо лежит на спинке, гантель в руке ладонью вверх. Согните руку, поднимая гантель к плечу, затем опустите почти до выпрямления под контролем. Выполните все повторения и смените руку." }
