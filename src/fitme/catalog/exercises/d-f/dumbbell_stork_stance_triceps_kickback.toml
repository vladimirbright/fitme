instructions = { en = "Hold a dumbbell in one hand and stand on the opposite leg, hinging forward with a flat back and the free hand braced on a wall or other sturdy support for balance. Keep the upper arm against your side, straighten the elbow back, then bend it under control. Finish all reps, then switch sides.", ru = "Возьмите гантель в одну руку и встаньте на противоположную ногу, наклонитесь вперёд с ровной спиной, свободной рукой обопритесь о стену или другую устойчивую опору для баланса. Плечо прижато к корпусу, выпрямите руку назад, затем согните под контролем. Выполните все повторения и смените сторону." }
