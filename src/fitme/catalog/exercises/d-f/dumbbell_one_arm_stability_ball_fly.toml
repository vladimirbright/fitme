instructions = { en = "Lie back on a stability ball with your head and upper back supported, feet wide, hips level. Hold one dumbbell above your chest, elbow slightly bent, lower it out to the side in an arc to chest level, then bring it back. Keep your hips level and finish all reps before switching arms.", ru = "Лягте на фитбол: голова и верх спины опираются на мяч, ноги широко, таз на уровне корпуса. Одна гантель над грудью, локоть слегка согнут: опустите её в сторону по дуге до уровня груди и верните обратно. Не заваливайте таз, все повторения на одну руку, затем смените." }
