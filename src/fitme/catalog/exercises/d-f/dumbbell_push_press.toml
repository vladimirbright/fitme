instructions = { en = "Hold a dumbbell in each hand at shoulder height with your feet shoulder-width apart. Dip a short way by bending the knees, then drive up through your legs and press the dumbbells overhead to full extension. Lower them back to your shoulders under control. Keep your ribs down and your head clear of the weights.", ru = "Гантели на уровне плеч, ноги на ширине плеч. Неглубоко присядьте, согнув колени, затем оттолкнитесь ногами и выжмите гантели вверх до полного выпрямления рук. Под контролем опустите их к плечам. Рёбра опущены, голову не подставляйте под траекторию гантелей." }
level = "advanced"
