instructions = { en = "Stand with soft knees and hinge forward at the hips with a flat back, dumbbells hanging below your chest, palms facing each other. With a slight bend in the elbows, raise the dumbbells out to the sides to shoulder line, then lower under control. Keep your neck in line with your spine.", ru = "Встаньте, колени слегка согнуты, наклонитесь вперёд от бёдер с прямой спиной, гантели свисают под грудью, ладони друг к другу. Слегка согнув локти, поднимите гантели в стороны до линии плеч, затем опустите под контролем. Шея остаётся продолжением позвоночника." }
