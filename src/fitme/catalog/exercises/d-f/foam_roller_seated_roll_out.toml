instructions = { en = "Sit on the floor with legs extended, a roller resting on the thighs, hands on top of it. Lean slightly forward and roll the roller along the thighs and shins as the arms reach straight ahead, then roll it back. Keep the motion small and slow.", ru = "Сядьте на пол, ноги вытянуты, ролл лежит на бёдрах, руки сверху. Слегка наклонитесь и прокатите ролл по бёдрам и голеням, вытягивая руки вперёд, затем верните назад. Движение небольшое и медленное." }
