instructions = { en = "Lie on a bench with a dumbbell in each hand above your chest, palms facing each other. Lower the weights toward your chest while turning the wrists so the palms face forward at the bottom, then press up while turning them back to facing each other. Use a light weight and keep a firm grip.", ru = "Лягте на скамью, в руках гантели над грудью, ладони друг к другу. Опускайте гантели к груди, поворачивая кисти так, чтобы внизу ладони смотрели вперёд, затем выжимайте вверх, возвращая ладони друг к другу. Берите небольшой вес и держите гантели крепко." }
