# Example FITME_PRICES_FILE (A§3.1, A§8.5 rule 5): USD per million tokens, in/out, for each
# *resolved* model string (the same strings `FITME_LLM_TIER_*`/`FITME_LLM_AGENT_*` resolve to,
# and what `decisions.model`/`llm_calls.model` store). A model with no entry here shows as
# "cost unknown" in /system rather than failing anything.
#
# Standard (non-batch, global routing) prices from
# https://platform.claude.com/docs/en/about-claude/pricing as of 2026-10-15. Prices change;
# check that page before relying on these for more than an order of magnitude. Only base
# input and output are used: Fitme doesn't use prompt caching or the Batch API. US-only
# inference (`inference_geo`) would be 1.1x on all of these.

# --- The default tiers (A§8.5) ---

[models."anthropic:claude-opus-5"]
input_per_million_usd = 5.0
output_per_million_usd = 25.0

[models."anthropic:claude-sonnet-5"]
# The $2/$10 launch price became the standard price; the planned $3/$15 did not happen.
input_per_million_usd = 2.0
output_per_million_usd = 10.0

[models."anthropic:claude-haiku-4-5"]
input_per_million_usd = 1.0
output_per_million_usd = 5.0

# --- Newer models, priced in case a tier or agent is moved to them ---

[models."anthropic:claude-fable-5-1"]
input_per_million_usd = 10.0
output_per_million_usd = 50.0

[models."anthropic:claude-opus-5-5"]
input_per_million_usd = 4.0
output_per_million_usd = 20.0

[models."anthropic:claude-sonnet-5-5"]
input_per_million_usd = 2.0
output_per_million_usd = 10.0

[models."anthropic:claude-haiku-5-5"]
# Prompts up to 100,000 tokens. Above that the request costs $0.50 / $2.50; Fitme's prompts
# stay far below it.
input_per_million_usd = 0.1
output_per_million_usd = 0.5
