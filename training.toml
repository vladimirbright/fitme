[meta]
version = 1
timezone = "Europe/Lisbon"

[[plan]]
name = "Сентябрьский блок — финальная неделя"

[[plan.schedule]]
weekday = 0
workout = "A"

[[plan.schedule]]
weekday = 2
workout = "B"

[[plan.schedule]]
weekday = 4
workout = "C"

[[plan.workout]]
key = "A"
title = "Присед + жим сидя"

[[plan.workout.exercise]]
exercise = "barbell_back_squat"
sets = 3
reps = [5, 5]
kg = 80
note = "Если первый подход тяжёлый или плывёт глубина — остаться на 75"

[[plan.workout.exercise]]
exercise = "dumbbell_seated_shoulder_press"
sets = 3
reps = [8, 8]
kg = 20
note = "Спинка ~80–85°, нейтральный хват, локти чуть вперёд, гантели до уровня ушей"

[[plan.workout.exercise]]
exercise = "cable_close_grip_pulldown"
sets = 3
reps = [10, 10]
kg = 73
note = "V-рукоять, к верху груди, корпус без раскачки"

[[plan.workout.exercise]]
exercise = "dumbbell_seated_french_press"
sets = 3
reps = [12, 12]
kg = 25
note = "Суперсет с ротациями на блоке, отдых 90 сек после круга"

[[plan.workout.exercise]]
exercise = "cable_rotation"
sets = 3
reps = [8, 8]
kg = 35
note = "35–40 кг, 8 на каждую сторону; суперсет с французским жимом"

[[plan.workout]]
key = "B"
title = "Румынская тяга + жим лёжа"

[[plan.workout.exercise]]
exercise = "barbell_romanian_deadlift"
sets = 3
reps = [8, 8]
kg = 67.5
note = "2–3 повтора в запасе, спина нейтральная"

[[plan.workout.exercise]]
exercise = "dumbbell_bench_press"
sets = 3
reps = [8, 8]
kg = 32.5
note = "Горизонтальная скамья, внизу без глубокого растяжения, локти 45–60°"

[[plan.workout.exercise]]
exercise = "cable_neutral_grip_pulldown"
sets = 3
reps = [10, 10]
kg = 61

[[plan.workout.exercise]]
exercise = "dumbbell_incline_curl"
sets = 3
reps = [10, 10]
kg = 10
note = "Веса по подходам: 10 / 10 / 12"

[[plan.workout.exercise]]
exercise = "dumbbell_lateral_raise"
sets = 3
reps = [15, 15]
kg = 5
note = "Сидя, корпус неподвижен"

[[plan.workout.exercise]]
exercise = "plank"
sets = 3
reps = [30, 45]
load = "bodyweight"
note = "Секунды"

[[plan.workout]]
key = "C"
title = "Жим штанги + выпады"

[[plan.workout.exercise]]
exercise = "barbell_bench_press"
sets = 3
reps = [8, 8]
kg = 85
note = "Лопатки сведены, пауза внизу, без отбива"

[[plan.workout.exercise]]
exercise = "dumbbell_reverse_lunge"
sets = 3
reps = [8, 8]
kg = 17.5
note = "8 на каждую ногу"

[[plan.workout.exercise]]
exercise = "barbell_bent_over_row"
sets = 3
reps = [8, 8]
kg = 52.5
note = "Корпус ~45°, к низу живота, нейтральная спина"

[[plan.workout.exercise]]
exercise = "dumbbell_incline_rear_delt_raise"
sets = 3
reps = [12, 12]
kg = 7.5
note = "Лёжа грудью на наклонной скамье 30–45°; основной вариант — тренажёр «обратная бабочка», если свободен"

